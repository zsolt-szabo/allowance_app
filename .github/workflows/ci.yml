name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what the README targets; 3.12 guards against accidentally
        # depending on very new syntax.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        # setup.cfg carries a documented baseline for pre-existing findings,
        # so this fails only on NEW violations.
        run: flake8 .

      - name: Characterization and unit tests
        run: pytest -q

      - name: Legacy functional suite
        # Kept running unchanged through Stages 0-3: it asserts against
        # rendered HTML, which is exactly what catches regressions while the
        # service layer is extracted underneath the Jinja handlers.
        working-directory: unit
        run: python test_group_01.py
