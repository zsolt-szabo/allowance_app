[flake8]
max-line-length = 79

# Pre-existing findings in code that has not been touched yet.
#
# These are a BASELINE, not an endorsement: CI stays green today so that any
# NEW violation fails the build, while the legacy debt below is burned down by
# the staged port.  Remove each entry as its file is refactored.
#
#   E722  bare except              -> Stage 1, replaced by DomainError handling
#   F401  imported but unused      -> Stage 2, removed by the app factory
#   E402  import not at top        -> Stage 2, the circular-import dodge goes
#   E741  ambiguous name 'l'       -> Stage 1, renamed during service extraction
#   E117/E305/E302  spacing        -> Stage 1
#   W605  invalid escape sequence  -> genuine latent bug; regex strings need r''
#   F507  %-format arity mismatch  -> GENUINE BUG: these raise TypeError when
#         the error path they sit in is actually taken (a_login.py:464,
#         a_child_login.py:677). Fixed in Stage 5 with a test.
per-file-ignores =
    app/__init__.py:E305,F401,E402
    app/views.py:E722,E302
    app/lib/a_finance.py:E722,E741,E117
    app/lib/a_login.py:E722,F507
    app/lib/a_child_login.py:E722,F507
    app/forms.py:E501
    config.py:E501
    db_create.py:E501
    db_migrate.py:F401
    allowance_payout_cron.py:W292
    local_deployment_params.py:E501,W605
    integrity_check.py:E402,E501
    unit/test_group_01.py:E402,E501,F401,E722,E741,E305
    unit/local_data.py:E501

exclude =
    .git,
    __pycache__,
    flaskenv,
    app/static,
    .pytest_cache

[tool:pytest]
testpaths = tests
python_files = test_*.py
